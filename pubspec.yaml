name: flutter_base
description: A base Flutter project.
version: 0.0.1+1
publish_to: none

# flutter pub upgrade --major-versions
environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  auto_route: ^11.0.0
  flutter_config:
    git:
      url: https://github.com/cogivn/flutter_config.git
      ref: master
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.9.0
  get_it: ^9.1.1
  injectable: ^2.6.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^9.0.0
  dartz: ^0.10.1
  uuid: ^4.5.2
  enum_annotation: ^0.0.4
  rx_shared_preferences: ^4.0.0
  streaming_shared_preferences: ^2.0.0
  dartx: ^1.2.0
  result_dart: ^2.1.1
  retrofit: ^4.9.1
  talker_flutter: ^5.1.1
  talker_dio_logger: ^5.1.1
  talker_riverpod_logger: ^5.1.1
  faker_dart: ^0.2.3
  webview_flutter: ^4.13.0
  gap: ^3.0.1
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  flutter_riverpod: ^3.0.3
  sizing: ^1.1.2
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  timezone: ^0.11.0
  jiffy: ^6.4.4
  loading_animation_widget: ^1.3.0
  timeago: ^3.7.1
  focus_detector_v2: ^3.1.0+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.7.1
  mocktail: ^1.0.4
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  auto_route_generator: ^10.2.5
  flutter_gen_runner: ^5.12.0
  intl_utils: ^2.8.11
  enum_generator: ^1.1.5
  injectable_generator: ^2.8.1
  flutter_launcher_icons: ^0.14.4
  retrofit_generator: ^10.2.0
  riverpod_generator: ^4.0.3

dependency_overrides:
  test_api: 0.7.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto/Roboto-MediumItalic.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto/Roboto-BoldItalic.ttf

flutter_gen:
  output: lib/generated/

  integrations:
    flutter_svg: true
    rive: false

  assets:
    enabled: true
    outputs:
      # Optional
      # Set to true if you want this package to be a package dependency
      # See: https://flutter.dev/docs/development/ui/assets-and-images#from-packages
      package_parameter_enabled: false
      style: dot-delimiter

  fonts:
    enabled: true

  colors:
    enabled: true
    inputs:
      - assets/colors/colors.xml

flutter_intl:
  enabled: true
  main_locale: "en"
  arb_dir: assets/l10n
